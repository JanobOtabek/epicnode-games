<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roast mashinasi</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#c6ff3d;--ink:#14141f;--pink:#d81b60;--card:#fffdf0;--mint:#2ee6a6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2b0a;--ink:#e8ffb0;--card:#33481a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d2b0a;--ink:#e8ffb0;--card:#33481a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:18px/1.4 system-ui,sans-serif;display:flex;align-items:center;justify-content:center;overflow-x:hidden}
h1{font:400 clamp(26px,7vw,40px)/1.1 'Lilita One',Impact,sans-serif;margin:.2em 0}
p{margin:.5em 0}
#hud{position:fixed;left:14px;top:calc(env(safe-area-inset-top,0px) + 10px);font:400 18px 'Lilita One',Impact,sans-serif}
#stage{width:min(92vw,520px);min-height:320px;text-align:center;background:var(--card);border:4px solid var(--ink);border-radius:18px;box-shadow:8px 8px 0 var(--ink);padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.btn{font:400 22px 'Lilita One',Impact,sans-serif;padding:12px 26px;background:var(--pink);color:#fff;border:4px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);cursor:pointer;margin:8px 4px}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
button:focus-visible,input:focus-visible{outline:4px solid var(--mint);outline-offset:3px}
input[type=text],#i{font:inherit;padding:10px;border:4px solid var(--ink);border-radius:12px;width:100%;background:#fff;color:#14141f}
input[type=range]{width:100%}
.big{font-size:70px;line-height:1}
.sm{font-size:15px;opacity:.85}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#ar{position:relative;width:100%;height:220px;background:rgba(0,0,0,.08);border-radius:12px;overflow:hidden}
.tg{position:absolute;width:60px;height:60px;font-size:44px;line-height:1;background:none;border:0;cursor:pointer;padding:0}
#bar{width:100%;height:34px;border:4px solid var(--ink);border-radius:20px;overflow:hidden;background:#fff}
#f{display:block;height:100%;width:0;background:var(--mint)}
#xb{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 8px);font:400 16px 'Lilita One',Impact,sans-serif;padding:6px 14px;background:var(--pink);color:#fff;border:3px solid var(--ink);border-radius:12px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);max-width:90vw;background:var(--ink);color:var(--card);padding:12px 18px;border-radius:14px;font-weight:600;text-align:center;z-index:9}
#mt{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);font-size:22px;padding:4px 10px;background:var(--card);border:3px solid var(--ink);border-radius:12px;cursor:pointer}
</style>
</head>
<body>
<div id="hud"></div><button id="xb" style="display:none">Chiqish</button><button id="mt" aria-label="Ovoz">🔊</button>
<main id="stage"></main>
<script>
let AC=null,mute=false;
function snd(f,d=.12,type='square',v=.06,sl=0){if(mute)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sl),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(t+d)}catch(e){}}
const seq=a=>a.forEach(([f,t,d,ty,sl])=>setTimeout(()=>snd(f,d||.15,ty||'square',.07,sl||0),t));
const sfx={click:()=>snd(660,.07),fail:()=>seq([[300,0,.2,'sawtooth',-100],[250,200,.2,'sawtooth',-100],[200,400,.45,'sawtooth',-120]]),win:()=>seq([[523,0],[659,120],[784,240],[1047,360,.3]]),roast:()=>seq([[392,0,.15,'triangle'],[330,150,.15,'triangle'],[262,300,.35,'triangle',-60]])};
document.addEventListener('pointerdown',e=>{if(e.target.closest('button'))sfx.click()});
document.querySelector('#mt').onclick=e=>{mute=!mute;e.target.textContent=mute?'🔇':'🔊'};
const $=s=>document.querySelector(s),st=$('#stage');
let tm=[],offs=[],nm='Nomaʼlum',t0=Date.now(),li=0;const S={fail:0,miss:0};
const later=(f,ms)=>{tm.push(setTimeout(f,ms))};
const on=(t,e,f)=>{t.addEventListener(e,f);offs.push(()=>t.removeEventListener(e,f))};
function scene(h){tm.forEach(clearTimeout);tm=[];offs.forEach(f=>f());offs=[];st.innerHTML=h}
const hud=t=>{$('#hud').textContent='Daraja '+t+'/100';$('#xb').style.display=t>50&&t<100?'block':'none'};
const bye=(e,h,p,f,ms=2400)=>{(/Dedim|Xato/.test(h)?sfx.fail:/Yutdingiz|Tamom|Uddalading|Axir/.test(h)?sfx.win:sfx.roast)();scene(`<div class="big">${e}</div><h1>${h}</h1><p>${p}</p>`);later(f,ms)};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const L=[l1,l2,l3,l4,l5,l6,l7,l8,l9,l10,l11,l12,l13,l14,l15,l16,l17,l18,l19,l20];
function next(){L[li++]()}

function l1(){
  scene(`<h1>Ismingiz nima?</h1><input id="i" maxlength="20" autocomplete="off"><button class="btn" id="o">Yuborish</button>`);hud(1);
  const go=()=>{nm=$('#i').value.replace(/[<>&"]/g,'').trim().slice(0,20)||'Nomaʼlum';
    bye('🧐',`${nm}?`,pick(['Hayotimda bunday ismni eshitmaganman. Ismingiz ham xuddi oʻzingiz kabi: esda qolmaydi.','Ism… ha, ism ekan. Men “xato” deb oʻylagandim.']),next)};
  $('#o').onclick=go;on($('#i'),'keydown',e=>{if(e.key==='Enter')go()});
}

function l2(){
  scene(`<h1>Boshlash tugmasi</h1><p>Faqat bos. Oson-ku?</p><div id="ar"><button id="b" class="btn" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);margin:0">BOS</button></div>`);hud(2);
  const b=$('#b'),a=$('#ar');let n=0;const W=['Yoʻq!','Tutolmaysan','Sekin!','Mayli…'];
  const fl=()=>{if(n>=4)return;n++;const r=a.getBoundingClientRect();b.style.transform='none';b.style.left=Math.random()*(r.width-b.offsetWidth)+'px';b.style.top=Math.random()*(r.height-b.offsetHeight)+'px';b.textContent=W[n-1]};
  b.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')fl()});
  b.addEventListener('pointerdown',()=>{if(n<4)fl();else bye('🙄','Axir bosding','4 marta qochdim, sen esa hali ham sekin. Rahmat, '+nm+'.',next)});
}

function l3(){
  let left=S.fail>=2?2:4;
  scene(`<h1>Qoida</h1><p>${left} soniya hech narsani bosma.</p><div class="big" id="c">${left}</div>`);hud(3);
  const lose=()=>{S.fail++;bye('😤','Dedim-ku!',pick(['Qoʻlingni stol ostiga qoʻy, '+nm+'.','Bitta qoida. BITTA. Va siz uni buzdingiz, chunki siz shunday odamsiz.','Qoʻling alohida yashayaptimi?']),l3,1800)};
  const tick=()=>{left--;$('#c').textContent=left;left<=0?bye('🏆','Yutdingiz','Yutuq: “Hech narsa qilmaslik”. Sizning yagona haqiqiy qobiliyatingiz.',next,2800):later(tick,1000)};
  later(()=>{on(document,'pointerdown',lose);on(document,'keydown',lose);later(tick,1000)},500);
}

function l4(){
  const T='Men noobman';
  scene(`<h1>Yozing: “Men zoʻr oʻyinchiman”</h1><input id="i" autocomplete="off"><p class="sm" id="m"></p><button class="btn" id="o">Tasdiqlash</button>`);hud(4);
  $('#i').oninput=e=>{e.target.value=T.slice(0,e.target.value.length);$('#m').textContent='Klaviaturangiz haqiqatni biladi.'};
  $('#o').onclick=()=>bye('📝','Tan oldingiz',`Imzo: “${T}”. Hujjat sudga yuborildi.`,next);
}

function l5(){
  const Q=[['7 × 8 = ?',['56','54','58','63'],0],['15 + 27 = ?',['41','42','43','52'],1],['100 − 1 = ?',['101','98','99','9'],2]];
  let q=0,sc=0;
  const show=()=>{
    const[t,o,c]=Q[q];const idx=[0,1,2,3];
    const draw=()=>{idx.sort(()=>Math.random()-.5);$('#o').innerHTML=idx.map(i=>`<button class="btn" data-i="${i}">${o[i]}</button>`).join('')};
    scene(`<h1>${t}</h1><div class="row" id="o"></div><p class="sm" id="m">Savol ${q+1}/3. Javoblar qochadi.</p>`);hud(5);
    draw();const iv=setInterval(draw,900);offs.push(()=>clearInterval(iv));
    $('#o').onclick=e=>{const b=e.target.closest('button');if(!b)return;
      const ok=+b.dataset.i===c;if(ok)sc++;clearInterval(iv);$('#o').innerHTML='';
      $('#m').textContent=ok?pick(['Toʻgʻri. Tasodif, albatta. Siz oʻlamadingiz, shunchaki bosdingiz.','Toʻgʻri! Kalkulyator ham hayron.']):pick(['Notoʻgʻri. Maktab sizni tarbiyalay olmagan. Rasmiy xulosa.','Hatto goʻdak ham biladi.']);
      later(()=>{q++;q<3?show():bye('🧮',sc+'/3',sc>1?'Ajablanarli. Tasodiflar silsilasi.':'Oʻqituvchingiz hanuz yigʻlaydi.',next,2800)},2200)};
  };
  show();
}

function l6(){
  scene(`<h1>Aqlingiz yuklanmoqda</h1><div id="bar"><i id="f"></i></div><p class="sm" id="m">0%</p>`);hud(6);
  let p=0;const R=['Qidirilmoqda…','Hech narsa topilmadi…','Yana qidiramiz…','Bu qanday boʻlishi mumkin?','Topdik! Yoʻq, bu paypoq ekan.'];
  const run=()=>{p+=2+Math.random()*4;
    if(p>=100){$('#f').style.width='100%';$('#m').textContent='Xato 404: aql topilmadi.';later(next,2800);return}
    $('#f').style.width=p+'%';$('#m').textContent=R[Math.min(4,Math.floor(p/20))];later(run,140)};
  run();
}

function l7(){
  let hit=0;
  scene(`<h1>Nishonni 5 marta ur</h1><p class="sm" id="m">0/5</p><div id="ar"><button id="tg" class="tg" aria-label="nishon">🎯</button></div>`);hud(7);
  const ar=$('#ar'),tg=$('#tg');
  const mv=()=>{const r=ar.getBoundingClientRect();tg.style.left=Math.random()*(r.width-60)+'px';tg.style.top=Math.random()*(r.height-60)+'px'};
  mv();const iv=setInterval(mv,700);offs.push(()=>clearInterval(iv));
  tg.onclick=e=>{e.stopPropagation();hit++;$('#m').textContent=hit+'/5';mv();if(hit>=5)bye('🎯','Uddalading','Sekin, lekin uddalading. “Sekin” — sizning familiyangiz.',next)};
  ar.onclick=()=>{S.miss++;$('#m').textContent=pick(['Chetga! Koʻzingiz bormi?','Bu devor edi.','Yana oʻtkazdingiz!','Sichqonchani boshqa odamga bering.'])};
}

function l8(){
  let n=0;
  scene(`<h1>Slayderni 50 ga qoʻying</h1><input type="range" id="r" min="0" max="100" value="0"><div class="big" id="v">0</div><p class="sm" id="m"></p>`);hud(8);
  const r=$('#r');
  r.oninput=()=>{$('#v').textContent=r.value};
  r.onchange=()=>{n++;
    if(n<4){$('#m').textContent=['Yaqin ham emas.','Yoʻq. Yana.','Siz raqamlarni bilasizmi?'][n-1];r.value=Math.floor(Math.random()*100);$('#v').textContent=r.value}
    else{r.value=50;$('#v').textContent=50;later(()=>bye('🤷','Mayli','Slayderni ham toʻgʻri qoʻya olmadingiz. Men oʻzim qoʻydim.',next,2600),900)}};
}

function l9(){
  scene(`<h1>Cookie fayllar</h1><p>Biz sizning “xursandligingizni” yigʻamiz.</p><div class="row"><button class="btn" id="y" style="font-size:44px;padding:20px 40px">QABUL</button><button id="n" style="font-size:9px">rad</button></div><p class="sm" id="m"></p>`);hud(9);
  $('#y').onclick=()=>bye('🍪','Rahmat','Qabul qilindi. Maʼlumotingizni hech kim xohlamaydi, shuning uchun uni oʻzimiz oʻchirdik.',next);
  $('#n').onclick=()=>{$('#m').textContent='Rad etish tugmasi ishlamaydi. U ham sizni tanimaydi.';$('#n').remove()};
}

function l10(){
  scene(`<h1>IQ hisoblanmoqda</h1><div class="big" id="v">…</div><p id="m"></p>`);hud(10);
  const iv=setInterval(()=>{$('#v').textContent=Math.floor(Math.random()*200)},80);offs.push(()=>clearInterval(iv));
  later(()=>{clearInterval(iv);$('#v').textContent='3';later(()=>{$('#m').textContent='Kartoshkaning IQ si 4. Siz kartoshkadan ham pastsiz.'},600);later(next,4200)},2800);
}

function l11(){
  let r=0;const R=['Juda erta! Hali yashil emas edi, shoshqaloq.','Juda sekin! Toshbaqa ham kuladi.','Juda tez! Aldadingiz. Aldash ham yaxshi uddalanmagan.'];
  const round=()=>{scene(`<h1>Yashil boʻlganda bos</h1><button class='btn' id='z' style='background:#c0392b;min-width:200px;min-height:90px'>KUT…</button><p class='sm' id='m'>${r+1}/3</p>`);hud(11);const z=$('#z');
    later(()=>{z.style.background='#1a7a45';z.textContent='BOS!'},1500+Math.random()*2000);
    z.onclick=()=>{$('#m').textContent=R[r];z.disabled=true;r++;later(r<3?round:()=>bye('🏳️','Mayli','Oʻyin buzilgan emas. Muammo sizda.',next,2400),2200)}};
  round();
}

function l12(){
  let t=0;scene(`<h1>Robot emasmisiz?</h1><p>Barcha <b>mashinalarni</b> tanlang.</p><div id='g' style='display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%'></div><p class='sm' id='m'></p><button class='btn' id='o'>Tasdiqlash</button>`);hud(12);
  for(let i=0;i<9;i++){const b=document.createElement('button');b.style.cssText='font-size:40px;background:none;border:0;cursor:pointer';b.textContent='🥔';b.onclick=()=>{b.textContent=b.textContent==='🥔'?'✅':'🥔'};$('#g').append(b)}
  const R=['Xato: bu yerda mashina yoʻq, hammasi kartoshka.','Yana xato. Kartoshkani mashina deb oʻlash — sizning darajangiz.','Mayli, siz robotsiz. Lekin eng zaif robot.'];
  $('#o').onclick=()=>{if(t>=3)return;$('#m').textContent=R[t++];if(t>=3)later(next,2600)};
}

function l13(){
  let ad=0;
  const show=()=>{ad++;let t=5;scene(`<div class='big'>📺</div><h1>Reklama ${ad}/3</h1><p>“Sekin Odamlar Uchun Soat”: 40% chegirma. Sizga mos.</p><button class='btn' id='s' disabled>${t}</button>`);hud(13);
    const tick=()=>{t--;const s=$('#s');if(t>0){s.textContent=t;later(tick,1000)}else{s.disabled=false;s.textContent='Oʻtkazish'}};later(tick,1000);
    $('#s').onclick=()=>ad<3?show():bye('🙃','Hazil','Reklama yoʻq edi. Siz 15 soniya shunchaki tikilib turdingiz.',next,2600)};
  show();
}

function l14(){
  let r=0;const C=['Men “bomba” tanladim. Bomba hammasini yutadi.','Men “pitsa” tanladim. Pitsa hammasidan kuchli.','Men “siz yutdingiz” tanladim… lekin ball menga yozildi. Yutqazish sizga yarashadi.'];
  scene(`<h1>Tosh, qaychi, qogʻoz</h1><div class='row'>${['✊','✌️','✋'].map(x=>`<button class='btn'>${x}</button>`).join('')}</div><p id='m'>Tanlang!</p>`);hud(14);
  st.querySelectorAll('.btn').forEach(b=>b.onclick=()=>{if(r>=3)return;$('#m').textContent=C[r++];if(r===3)later(next,3200)});
}

function l15(){
  let c=0;const ev={5:'Pechenye sizdan xafa.',12:'Pechenye “ey!” dedi.',20:'Katta pechenye keldi. U ham xafa.',28:'Pechenye sizga qarz: 1 000 000 pechenye.',35:'Pechenye telefon qildi: “bas qil”.'};
  scene(`<h1>Pechenye bos</h1><button id='k' style='font-size:90px;background:none;border:0;cursor:pointer'>🍪</button><div class='big' id='c'>0</div><p class='sm' id='m'>Koʻproq bossangiz, koʻproq pechenye.</p>`);hud(15);
  $('#k').onclick=()=>{c++;$('#c').textContent=c;if(ev[c])$('#m').textContent=ev[c];if(c===40)bye('😱','Pechenye sizni yedi','Qarshilik ham qilolmadingiz. Pechenye ham sizdan kuchliroq.',next,2800)};
}

function l16(){
  const E=['🐸','🍕','🚗','🎈','🦆','🧦'];const s=E.slice().sort(()=>Math.random()-.5).slice(0,5);
  scene(`<h1>Eslab qoling!</h1><div class='big' style='font-size:44px'>${s.join(' ')}</div><p class='sm'>2 soniya…</p>`);hud(16);
  later(()=>{const q=s[0];const o=E.slice().sort(()=>Math.random()-.5).slice(0,4);if(!o.includes(q))o[0]=q;o.sort(()=>Math.random()-.5);
    scene(`<h1>Qaysi biri roʻyxatda <u>birinchi</u> edi?</h1><div class='row'>${o.map(x=>`<button class='btn' data-e='${x}'>${x}</button>`).join('')}</div>`);
    st.querySelectorAll('.btn').forEach(b=>b.onclick=()=>{const ok=b.dataset.e===q;bye(ok?'🤨':'🐟',ok?'Toʻgʻri':'Notoʻgʻri',ok?'Tasodif. Oltin baliqning xotirasi 3 soniya. Sizniki ham deyarli shuncha.':'Oltin baliq ham eslagan boʻlardi.',next,2800)})},2200);
}

function l17(){
  const rules=[['Kamida 8 belgi',v=>v.length>=8],['Katta harf',v=>/[A-Z]/.test(v)],['Raqam',v=>/\d/.test(v)],['Kartoshka emoji 🥔',v=>v.includes('🥔')],['Ismingiz boʻlmasin (u hamma narsani buzadi)',v=>!v.toLowerCase().includes(nm.toLowerCase())],['“!” bilan tugasin',v=>v.endsWith('!')]];
  scene(`<h1>Parol oʻlab toping</h1><input id='i' autocomplete='off'><div id='rl' style='text-align:left;width:100%;margin-top:8px'></div><div class='row'><button class='btn' id='p'>+🥔</button><button class='btn' id='o' disabled>Davom</button></div>`);hud(17);
  const chk=()=>{const v=$('#i').value;let ok=true;$('#rl').innerHTML=rules.map(([t,f])=>{const g=f(v);if(!g)ok=false;return `<div>${g?'✅':'❌'} ${t}</div>`}).join('');$('#o').disabled=!ok};chk();
  $('#i').oninput=chk;$('#p').onclick=()=>{$('#i').value+='🥔';chk()};
  $('#o').onclick=()=>bye('🔐','Parol qabul qilindi','Zaif. Xuddi egasi kabi.',next);
}

function l18(){
  scene(`<h1>Oʻyinni baholang</h1><div class='row' id='s'>${[1,2,3,4,5].map(i=>`<button class='btn' data-i='${i}'>${'⭐'.repeat(i)}</button>`).join('')}</div>`);hud(18);
  $('#s').onclick=e=>{const b=e.target.closest('button');if(!b)return;bye('⭐','Bahoyingiz: 1 yulduz',`Siz ${b.dataset.i} tanlagansiz, lekin biz oʻzimiz tuzatdik. Sizning fikringiz bizga qiziq emas.`,next,3400)};
}

function l19(){
  scene(`<h1>Doʻstlaringiz sizni qanday taʼriflaydi?</h1><div class='row'>${['Sekin','Juda sekin','Toʻxtab qolgan','Doʻstim yoʻq'].map(x=>`<button class='btn'>${x}</button>`).join('')}</div>`);hud(19);
  st.querySelectorAll('.btn').forEach(b=>b.onclick=()=>bye('📉','Natija','Soʻrovda 1 kishi qatnashdi: siz. Qolganlarga murojaat qildik, hech kim javob bermadi.',next,3400));
}

function l20(){
  const need=()=>S.fail>=3?2000:5000;
  scene(`<h1>Yakuniy sinov</h1><p>Tugmani <b>${need()/1000} soniya</b> bosib turing.</p><div id='bar'><i id='f'></i></div><button class='btn' id='b' style='touch-action:none;user-select:none'>BOSIB TUR</button><p class='sm' id='m'></p>`);hud(20);
  const b=$('#b');let th=0,iv=0;
  const stop=()=>{if(!th)return;clearInterval(iv);th=0;S.fail++;$('#f').style.width='0';$('#m').textContent=pick(['Qoʻlingiz qaltiradi. Xuddi irodangiz kabi.','Yana! 5 soniyani ham ushlab turolmaysiz.','Bu oʻyin ham sizdan voz kechdi.'])};
  b.onpointerdown=e=>{e.preventDefault();th=Date.now();iv=setInterval(()=>{const p=(Date.now()-th)/need();$('#f').style.width=Math.min(100,p*100)+'%';if(p>=1){clearInterval(iv);th=0;bye('👑','Sertifikat tayyor','Qoʻling bor ekan. Afsus, miyang yoʻq.',next,2800)}},50)};
  b.onpointerup=stop;b.onpointerleave=stop;b.onpointercancel=stop;
}

const K=[];
